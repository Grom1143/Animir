name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-build.txt

      - name: Build Animir.exe
        run: python -m PyInstaller --noconfirm --clean packaging/Animir.spec --distpath dist-exe --workpath build

      - name: Prepare installer inputs
        shell: pwsh
        run: Copy-Item dist-exe\Animir.exe Animir.exe -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: python packaging/build_installer.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Animir-windows
          path: |
            dist-exe/Animir.exe
            dist/*.exe
